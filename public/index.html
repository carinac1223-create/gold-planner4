<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>目標理財規劃</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f3ee;--card:#fffefb;--ink:#12302b;--mute:#5d716c;--line:#dcd8cc;--accent:#0f7a5f;--accent2:#c8952b;--bad:#b4472f;--soft:#e4efe9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b18;--card:#15262a;--ink:#e8efe9;--mute:#93a9a3;--line:#27403d;--accent:#3fc29c;--accent2:#e3b04b;--bad:#ef8a70;--soft:#1b3a35}}
:root[data-theme="dark"]{--bg:#0e1b18;--card:#15262a;--ink:#e8efe9;--mute:#93a9a3;--line:#27403d;--accent:#3fc29c;--accent2:#e3b04b;--bad:#ef8a70;--soft:#1b3a35}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC",system-ui,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:28px 18px 60px}
h1{font:700 clamp(28px,5vw,42px)/1.2 "Noto Serif TC",serif;margin:0 0 6px}
.sub{color:var(--mute);margin:0 0 22px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tab{background:none;border:0;color:var(--mute);font:500 16px "Noto Sans TC",sans-serif;padding:10px 16px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected=true]{color:var(--accent);border-color:var(--accent);font-weight:700}
.grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.card h2{font:700 18px "Noto Serif TC",serif;margin:0 0 14px}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
input,select{width:100%;font:500 16px "Noto Sans TC",sans-serif;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input:disabled{opacity:.55;background:var(--soft)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:20px;padding:6px 14px;font:500 14px "Noto Sans TC",sans-serif;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.hero{border-radius:14px;background:var(--ink);color:var(--bg);padding:22px;margin-bottom:16px}
.hero small{opacity:.75;display:block}
.hero b{font:700 clamp(30px,6vw,46px)/1.2 "Noto Serif TC",serif;display:block;margin:2px 0 4px;word-break:break-all}
.hero span{opacity:.85;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
@media(max-width:560px){.stats{grid-template-columns:1fr}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat small{color:var(--mute);display:block;font-size:13px}.stat b{font-size:19px}
.ok{color:var(--accent)}.no{color:var(--bad)}
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{color:var(--mute);font-weight:500}
tr.cur td{background:var(--soft);font-weight:700}
svg{width:100%;height:auto;display:block}
.note{font-size:13px;color:var(--mute);margin-top:12px}
.seg{display:flex;gap:6px;margin-bottom:6px}.seg .chip{flex:1;text-align:center;border-radius:8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<h1>目標理財規劃</h1>
<p class="sub">設定一個目標，看看每月該存多少、現在的計畫到不到得了。</p>
<div class="tabs" role="tablist">
<button class="tab" role="tab" aria-selected="true" data-t="goal">目標規劃</button>
<button class="tab" role="tab" aria-selected="false" data-t="tvm">PV / FV / PMT 計算機</button>
</div>

<section id="goal" class="grid">
<div class="card">
<h2>我的目標</h2>
<div class="chips" id="presets"></div>
<label>目標金額 (NT$)</label><input id="g_target" type="number" value="3000000" min="0">
<div class="row"><div><label>達成年數</label><input id="g_years" type="number" value="10" min="1" max="60"></div>
<div><label>目前已存 (NT$)</label><input id="g_pv" type="number" value="200000" min="0"></div></div>
<div class="row"><div><label>預期年報酬率 %</label><input id="g_rate" type="number" value="5" step="0.1"></div>
<div><label>通膨率 %</label><input id="g_inf" type="number" value="2" step="0.1"></div></div>
<label>目前每月存入 (NT$)</label><input id="g_pmt" type="number" value="15000" min="0">
<label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input id="g_real" type="checkbox" style="width:auto" checked>目標金額按通膨調整（保留購買力）</label>
</div>
<div id="g_out"></div>
</section>

<section id="tvm" class="grid" hidden>
<div class="card">
<h2>時間價值計算</h2>
<label>要求哪一項？</label>
<div class="seg" id="mode"><button class="chip" data-m="FV" aria-pressed="true">FV 終值</button><button class="chip" data-m="PV" aria-pressed="false">PV 現值</button><button class="chip" data-m="PMT" aria-pressed="false">PMT 每期</button></div>
<label>PV 現值（一開始投入）</label><input id="t_pv" type="number" value="100000">
<label>PMT 每期存入</label><input id="t_pmt" type="number" value="10000">
<label>FV 終值（未來金額）</label><input id="t_fv" type="number" value="2000000">
<div class="row"><div><label>年利率 %</label><input id="t_rate" type="number" value="5" step="0.1"></div>
<div><label>年數</label><input id="t_years" type="number" value="10" step="0.5"></div></div>
<div class="row"><div><label>每年期數</label><select id="t_freq"><option value="12">12（每月）</option><option value="4">4（每季）</option><option value="2">2（每半年）</option><option value="1">1（每年）</option></select></div>
<div><label>存入時間</label><select id="t_when"><option value="0">期末</option><option value="1">期初</option></select></div></div>
</div>
<div id="t_out"></div>
</section>
<p class="note">本工具僅供試算參考，報酬率為假設值，不代表實際投資結果，也不構成投資建議。</p>
</div>
<script>
const $=id=>document.getElementById(id),num=id=>parseFloat($(id).value)||0;
const fmt=n=>isFinite(n)?'NT$ '+Math.round(n).toLocaleString('en-US'):'—';
const annuity=(i,n)=>i===0?n:(Math.pow(1+i,n)-1)/i;
const fvOf=(pv,pmt,i,n,t)=>pv*Math.pow(1+i,n)+pmt*annuity(i,n)*(t?1+i:1);

/* ---------- Goal planner ---------- */
const presets={退休:[20000000,30,500000,5,15000],買房頭期款:[4000000,8,300000,4,30000],子女教育:[2000000,15,100000,5,8000],環遊世界:[600000,4,50000,3,10000],緊急預備金:[300000,2,0,2,10000]};
const pe=$('presets');
Object.keys(presets).forEach(k=>{const b=document.createElement('button');b.className='chip';b.textContent=k;b.setAttribute('aria-pressed','false');
b.onclick=()=>{[...pe.children].forEach(c=>c.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');
const p=presets[k];['g_target','g_years','g_pv','g_rate','g_pmt'].forEach((id,j)=>$(id).value=p[j]);goal()};pe.appendChild(b)});

function sim(pv,pmt,r,yrs){const m=r/100/12,out=[pv];let b=pv;for(let k=1;k<=yrs*12;k++){b=b*(1+m)+pmt;if(k%12===0)out.push(b)}return out}
function chart(yrs,cur,need,target){
 const W=640,H=300,L=64,R=16,T=16,B=34,mx=Math.max(target,...cur,...need)*1.05;
 const x=i=>L+(W-L-R)*i/yrs,y=v=>T+(H-T-B)*(1-v/mx);
 const path=a=>a.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join('');
 let g='';for(let k=0;k<=4;k++){const v=mx*k/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--mute)">${v>=1e6?(v/1e6).toFixed(1)+'M':Math.round(v/1e3)+'K'}</text>`}
 const step=Math.ceil(yrs/6);for(let i=0;i<=yrs;i+=step)g+=`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--mute)">${i}年</text>`;
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="資產成長圖">${g}
 <line x1="${L}" x2="${W-R}" y1="${y(target)}" y2="${y(target)}" stroke="var(--accent2)" stroke-width="2" stroke-dasharray="6 5"/>
 <path d="${path(need)}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-opacity=".55" stroke-dasharray="2 4"/>
 <path d="${path(cur)}" fill="none" stroke="var(--accent)" stroke-width="3.5"/>
 <circle cx="${x(yrs)}" cy="${y(cur[yrs])}" r="5" fill="var(--accent)"/></svg>
 <div class="note" style="display:flex;gap:16px;flex-wrap:wrap;margin:6px 0 0"><span><b style="color:var(--accent)">━</b> 目前計畫</span><span><b style="color:var(--accent)">┅</b> 達標所需存法</span><span><b style="color:var(--accent2)">╌</b> 目標金額</span></div>`}

function goal(){
 const yrs=Math.max(1,Math.round(num('g_years'))),inf=num('g_inf')/100,r=num('g_rate'),i=r/100/12,n=yrs*12;
 const base=num('g_target'),target=$('g_real').checked?base*Math.pow(1+inf,yrs):base,pv=num('g_pv'),pmt=num('g_pmt');
 const need=Math.max(0,(target-pv*Math.pow(1+i,n))/annuity(i,n));
 const cur=sim(pv,pmt,r,yrs),proj=cur[yrs],gap=target-proj,pct=Math.min(100,proj/target*100),ok=gap<=0;
 const needLine=sim(pv,need,r,yrs);
 const paid=pv+pmt*n;
 let rows='';[r-2,r-1,r,r+1,r+2].filter(v=>v>=0).forEach(v=>{const ii=v/100/12,f=fvOf(pv,pmt,ii,n,0),nd=Math.max(0,(target-pv*Math.pow(1+ii,n))/annuity(ii,n));
 rows+=`<tr class="${v===r?'cur':''}"><td>${v.toFixed(1)}%</td><td>${fmt(f)}</td><td class="${f>=target?'ok':'no'}">${f>=target?'達標':'差 '+fmt(target-f)}</td><td>${fmt(nd)}</td></tr>`});
 $('g_out').innerHTML=`
 <div class="hero"><small>要在 ${yrs} 年後達到 ${fmt(target)}${$('g_real').checked?'（已含通膨）':''}</small><small>每月需存入</small><b>${fmt(need)}</b>
 <span>${pmt>=need?`你目前每月存 ${fmt(pmt)}，已超過所需 ${fmt(pmt-need)}。`:`目前每月存 ${fmt(pmt)}，每月還需多存 ${fmt(need-pmt)}。`}</span></div>
 <div class="stats"><div class="stat"><small>照目前計畫，${yrs} 年後</small><b>${fmt(proj)}</b></div>
 <div class="stat"><small>${ok?'超出目標':'與目標差距'}</small><b class="${ok?'ok':'no'}">${fmt(Math.abs(gap))}</b></div>
 <div class="stat"><small>其中投資獲利</small><b>${fmt(proj-paid)}</b></div></div>
 <div class="card" style="margin-bottom:16px"><h2>達成進度 ${pct.toFixed(0)}%</h2><div class="bar"><i style="width:${pct}%"></i></div>
 <div class="note" style="margin:0 0 12px">${ok?'照這個速度，你可以如期達成目標。':'照目前速度會落後，可以提高每月存入、延長年限，或調整目標。'}</div>${chart(yrs,cur,needLine,target)}</div>
 <div class="card"><h2>報酬率敏感度</h2><div class="tbl"><table><tr><th>年報酬率</th><th>目前計畫終值</th><th>結果</th><th>所需月存</th></tr>${rows}</table></div>
 <div class="note">以每月複利、月底存入計算。報酬率變動 1% 對長期結果影響很大，建議用保守數字規劃。</div></div>`;
}
['g_target','g_years','g_pv','g_rate','g_inf','g_pmt','g_real'].forEach(id=>$(id).addEventListener('input',goal));

/* ---------- TVM calculator ---------- */
let mode='FV';
document.querySelectorAll('#mode .chip').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('#mode .chip').forEach(c=>c.setAttribute('aria-pressed',c===b));tvm()});
function tvm(){
 ['PV','PMT','FV'].forEach(k=>$('t_'+k.toLowerCase()).disabled=(k===mode));
 const f=+$('t_freq').value,t=+$('t_when').value,i=num('t_rate')/100/f,n=Math.round(num('t_years')*f);
 const a=annuity(i,n)*(t?1+i:1),g=Math.pow(1+i,n);let pv=num('t_pv'),pmt=num('t_pmt'),fv=num('t_fv');
 if(mode==='FV')fv=pv*g+pmt*a;else if(mode==='PV')pv=(fv-pmt*a)/g;else pmt=(fv-pv*g)/a;
 $('t_'+mode.toLowerCase()).value=Math.round(mode==='PMT'?pmt*100:(mode==='PV'?pv:fv))/(mode==='PMT'?100:1);
 const lab={FV:'終值 FV',PV:'現值 PV',PMT:'每期存入 PMT'}[mode],val={FV:fv,PV:pv,PMT:pmt}[mode];
 const inv=pv+pmt*n,gain=fv-inv,pi=inv>0?Math.max(0,Math.min(100,inv/Math.max(fv,1)*100)):0;
 const per={12:'每月',4:'每季',2:'每半年',1:'每年'}[f];
 $('t_out').innerHTML=`<div class="hero"><small>${lab}</small><b>${fmt(val)}</b><span>${n} 期，每期利率 ${(i*100).toFixed(3)}%，${per}${t?'期初':'期末'}存入</span></div>
 <div class="stats"><div class="stat"><small>投入本金合計</small><b>${fmt(inv)}</b></div><div class="stat"><small>利息收益</small><b class="${gain>=0?'ok':'no'}">${fmt(gain)}</b></div><div class="stat"><small>終值 FV</small><b>${fmt(fv)}</b></div></div>
 <div class="card"><h2>終值組成</h2><div class="bar"><i style="width:${pi}%"></i></div><div class="note" style="margin:0">本金 ${pi.toFixed(0)}%　·　利息 ${(100-pi).toFixed(0)}%</div>
 <div class="note" style="margin-top:14px;line-height:1.9">FV = PV×(1+i)<sup>n</sup> + PMT×[((1+i)<sup>n</sup>−1)/i]<br>i = 年利率 ÷ 每年期數，n = 年數 × 每年期數</div>
 <div class="note">三項中選一項求解，其餘兩項與利率、年數由你輸入。</div></div>`;
}
['t_pv','t_pmt','t_fv','t_rate','t_years','t_freq','t_when'].forEach(id=>$(id).addEventListener('input',tvm));

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===b));
 $('goal').hidden=b.dataset.t!=='goal';$('tvm').hidden=b.dataset.t!=='tvm'});
goal();tvm();
</script>
</body>
</html>
